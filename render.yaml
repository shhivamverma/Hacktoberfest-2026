services:
  - type: web
    name: trailhead-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn trailhead.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OLLAMA_HOST
        value: http://127.0.0.1:11434
