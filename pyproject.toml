[project]
name = "trailhead"
version = "0.1.0"
description = "Offline issue-to-code trail finder for first-time open-source contributors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "pytest>=7.0.0",
    "graphifyy>=0.9.95",
]

[project.scripts]
trailhead = "trailhead.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
